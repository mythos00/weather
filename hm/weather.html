
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #4facfe, transparent 35%),
                radial-gradient(circle at bottom right, #6a5acd, transparent 35%),
                linear-gradient(135deg, #0f172a, #1e293b);

            color: white;
        }

        .container {
            width: 420px;
            max-width: 92%;
        }

        .weather-box {
            padding: 35px;
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            text-align: center;

            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 30px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .search {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px 16px;

            border: none;
            outline: none;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            font-size: 15px;

            border: 1px solid rgba(255,255,255,0.15);
        }

        input::placeholder {
            color: #cbd5e1;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
        }

        button {
            padding: 14px 18px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.4);
        }

        button:active {
            transform: scale(0.96);
        }

        #result {
            margin-top: 30px;
        }

        .city {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .country {
            color: #cbd5e1;
            font-size: 14px;
        }

        .icon {
            font-size: 85px;
            margin: 15px 0 5px;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .temperature {
            font-size: 65px;
            font-weight: bold;
            margin: 5px 0;
        }

        .condition {
            font-size: 18px;
            color: #e2e8f0;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail {
            padding: 15px 10px;

            border-radius: 16px;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);

            color: #e2e8f0;
            font-size: 14px;
        }

        .detail span {
            display: block;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .date {
            margin-top: 18px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .error {
            padding: 14px;
            border-radius: 12px;

            background: rgba(239, 68, 68, 0.15);
            color: #fecaca;

            border: 1px solid rgba(239,68,68,0.3);
        }

        @media (max-width: 500px) {

            .weather-box {
                padding: 25px;
            }

            .search {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="weather-box">

        <h1>🌤️ Weather App</h1>

        <div class="subtitle">
            Şəhərin hava vəziyyətini öyrən
        </div>

        <div class="search">

            <input
                type="text"
                id="city"
                placeholder="Məsələn: Baku"
                onkeydown="if(event.key === 'Enter') getWeather()"
            >

            <button onclick="getWeather()">
                Axtar
            </button>

        </div>

        <div id="result"></div>

    </div>

</div>


<script>

async function getWeather() {

    const city = document.getElementById("city").value.trim();

    const result = document.getElementById("result");

    if (!city) {

        result.innerHTML =
            "<div class='error'>⚠️ Zəhmət olmasa şəhər daxil edin.</div>";

        return;
    }

    result.innerHTML =
        "<p>⏳ Hava məlumatları yüklənir...</p>";

    try {

        const response = await fetch(
            `http://127.0.0.1:8000/weather?city=${encodeURIComponent(city)}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Xəta baş verdi.");
        }

        result.innerHTML = `

            <div class="city">
                ${data.city}
            </div>

            <div class="country">
                ${data.country}
            </div>

            <div class="icon">
                ${data.icon}
            </div>

            <div class="temperature">
                ${data.temperature}°C
            </div>

            <div class="condition">
                ${data.condition}
            </div>

            <div class="details">

                <div class="detail">
                    <span>🌡️</span>
                    Hiss olunan
                    <br>
                    <strong>${data.feels_like}°C</strong>
                </div>

                <div class="detail">
                    <span>💧</span>
                    Rütubət
                    <br>
                    <strong>${data.humidity}%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    Külək
                    <br>
                    <strong>${data.wind} km/h</strong>
                </div>

                <div class="detail">
                    <span>☀️</span>
                    Weather Code
                    <br>
                    <strong>${data.weather_code}</strong>
                </div>

            </div>

            <div class="date">
                📅 ${data.date} &nbsp; | &nbsp; 🕐 ${data.time}
            </div>

        `;

    } catch (error) {

        result.innerHTML =
            `<div class="error">❌ ${error.message}</div>`;

    }

}

</script>

</body>
</html>
